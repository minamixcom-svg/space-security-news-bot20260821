name: Daily News Summary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      # ref: main を明示指定して、必ず main ブランチの最新コードを取得
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser googlenewsdecoder

      # 実行直前に main.py 内の「gemini-2.0-flash」を「gemini-1.5-flash」に強制書き換え（保険処理）
      - name: Force Update Model Name
        run: |
          sed -i 's/gemini-2.0-flash/gemini-1.5-flash/g' main.py

      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
